theme = "volks-typo"
base_url = "https://www.grayunicorn.com"
title = "Gray Unicorn"
compile_sass = true
description = "Random collection of project, infrequently updated"
build_search_index = true

taxonomies = [
  { name = "categories", feed = true },
  { name = "tags", feed = true },
]

# Site-wide feed disabled; the blog section generates its own blog-only feed at
# /blog/rss.xml.
generate_feeds = false
feed_filenames = ["rss.xml"]

[markdown.highlighting]
theme = "nord"

[search]
index_format = "elasticlunr_json"

[extra]
# Site title/description come from the top-level `title`/`description` keys above.
# Favicon: defaults to the bundled favicon.svg; set to your own file in static/
# (e.g. "/favicon.ico" or "/favicon.svg").
# favicon = "/favicon.svg"

# Header logo: omit to show the site title as text; set to an image in static/
# (e.g. "/site-title.svg") to use a logo image instead.
# logo = "/site-title.svg"

# Header repository button: set repo_url to show it (omit to hide it).
# repo_icon picks a bundled icon (github | gitlab | codeberg | ...) or a custom
# SVG path in static/ (e.g. "/icons/gitea.svg"). repo_label sets the button text.
# repo_url = "https://gitlab.com/tisgoud/zola-volks-typo-theme"
# repo_icon = "gitlab"
# repo_label = "Star"

# Main navigation — edit/add/reorder links here without touching theme files.
main_menu = [
#  { name = "Home", url = "/" },
  { name = "Blog", url = "/blog" },
#  { name = "Categories", url = "/categories" },
#   { name = "About", url = "/about" },
]

# Sidebar position on pages that show it: "left" (default) or "right".
# A header button lets visitors show/hide the sidebar (remembered per browser).
# sidebar_position = "left"

# Show each post's hero image (frontmatter [extra] image) as a cropped thumbnail
# above the title in post listings (blog, categories, tags). Default true.
list_images = true

author_name = "Adam Eberbach"
author_bio = "Computer Science graduate, started with C and Ada. Electronics, 3D design and printing, flight sims are what I do for fun."
author_avatar = "/images/profile.jpg"

# Social links (footer, About author bio, Contact). Add/remove/reorder freely.
# `icon` = a bundled icon in static/icons/ (github, gitlab, codeberg, x,
# instagram, linkedin, mastodon, email, rss) or a custom path like "/icons/gitea.svg".
social_links = [
  { name = "Mastodon", icon = "mastodon", url = "https://mastodon.online/@aeberbach" },
  { name = "Github", icon = "github", url = "https://github.com/aeberbach" },
]
