<script>
  // Theme toggle: cycles light -> dark -> auto (auto follows the OS, live-updating)
  (function () {
    const root = document.documentElement;
    const btn = document.querySelector('[data-theme-cycle]');
    if (!btn) return;
    const order = ['light', 'dark', 'auto'];
    const mql = window.matchMedia('(prefers-color-scheme: dark)');

    function systemTheme() { return mql.matches ? 'dark' : 'light'; }

    function apply(mode) {
      root.dataset.theme = mode === 'auto' ? systemTheme() : mode;
      root.dataset.themeMode = mode;
      btn.setAttribute('title', 'Theme: ' + mode + ' (click to change)');
      try { localStorage.setItem('theme', mode); } catch (e) {}
    }

    btn.addEventListener('click', function () {
      const current = localStorage.getItem('theme') || 'auto';
      apply(order[(order.indexOf(current) + 1) % order.length]);
    });

    // Reflect the stored/initial mode in the tooltip on load
    apply(localStorage.getItem('theme') || 'auto');

    // Keep "auto" in sync when the OS theme changes
    function onSystemChange() {
      if ((localStorage.getItem('theme') || 'auto') === 'auto') {
        root.dataset.theme = systemTheme();
      }
    }
    if (mql.addEventListener) { mql.addEventListener('change', onSystemChange); }
    else if (mql.addListener) { mql.addListener(onSystemChange); }
  })();

  // Sidebar show/hide toggle (persisted; disabled on pages without a sidebar)
  function initSidebarToggle() {
    var btn = document.getElementById('sidebar-toggle');
    if (!btn) return;

    // The sidebar element appears later in the document than this header, so
    // this must run after the DOM is parsed (see the dispatch below).
    if (!document.querySelector('.sidebar')) {
      btn.disabled = true;
      btn.setAttribute('aria-disabled', 'true');
      return;
    }

    var root = document.documentElement;
    function sync() {
      btn.setAttribute('aria-pressed', root.dataset.sidebar === 'hidden' ? 'false' : 'true');
    }
    sync();

    btn.addEventListener('click', function () {
      if (root.dataset.sidebar === 'hidden') {
        delete root.dataset.sidebar;
        try { localStorage.setItem('sidebar', 'shown'); } catch (e) {}
      } else {
        root.dataset.sidebar = 'hidden';
        try { localStorage.setItem('sidebar', 'hidden'); } catch (e) {}
      }
      sync();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initSidebarToggle);
  } else {
    initSidebarToggle();
  }

  // Hamburger menu functionality
  (function () {
    const hamburgerToggle = document.getElementById('hamburger-toggle');
    const mobileMenu = document.getElementById('mobile-menu');
    const body = document.body;

    if (!hamburgerToggle || !mobileMenu) return;

    hamburgerToggle.addEventListener('click', () => {
      const isOpen = mobileMenu.classList.contains('active');

      if (isOpen) {
        mobileMenu.classList.remove('active');
        hamburgerToggle.setAttribute('aria-expanded', 'false');
        body.style.overflow = '';
      } else {
        mobileMenu.classList.add('active');
        hamburgerToggle.setAttribute('aria-expanded', 'true');
        body.style.overflow = 'hidden';
      }
    });

    // Close menu when clicking on a link
    const mobileNavLinks = mobileMenu.querySelectorAll('.mobile-nav-link');
    mobileNavLinks.forEach(link => {
      link.addEventListener('click', () => {
        mobileMenu.classList.remove('active');
        hamburgerToggle.setAttribute('aria-expanded', 'false');
        body.style.overflow = '';
      });
    });

    // Close menu on escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && mobileMenu.classList.contains('active')) {
        mobileMenu.classList.remove('active');
        hamburgerToggle.setAttribute('aria-expanded', 'false');
        body.style.overflow = '';
      }
    });
  })();
</script>
